<div class="term-overview">
    <div class="term-info">
        <h2 class="term-title">{{term()}}</h2>
        <div class="term-dates">
        <span>📅 {{term_dates()}}</span>
        <span>⏱️ {{weeks()}} weeks</span>
        </div>
    </div>
    <div class="term-stats">
        <div class="term-stat">
        <span class="stat-number">{{no_topics()}}</span>
        <span class="stat-label">Topics</span>
        </div>
        <div class="term-stat">
        <span class="stat-number">{{no_lessons()}}</span>
        <span class="stat-label">Lessons</span>
        </div>
        <div class="term-stat">
        <span class="stat-number">{{no_assessments()}}</span>
        <span class="stat-label">Assessments</span>
        </div>
    </div>
</div>
