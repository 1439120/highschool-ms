<app-breadcrumb [titleBreadcrumbs]="breadCrumb"/>

<div class="teacher-details-container">

  <!-- Scrollable Content Area -->
  <div class="scrollable-content">
    <div class="details-content-wrapper">
      <!-- Teacher Profile Card -->
      <div class="profile-card">
        <!-- Details Header -->
        <app-details-header [user]="teacher()" [displayName]="teacher().name + ' ' + teacher().surname"
          [recordId]="teacherId()" [role]="teacher().role"/>

        <!-- Details Sections -->
        <div class="details-sections">
          <!-- Personal Information -->
          <app-personal-information-section [userId]="teacherId()" [userType]="'staff'"/>        

          <!-- Subjects & Expertise -->
          <!-- <section class="details-section">
            <h2 class="section-title">
              <span class="section-icon">📚</span>
              Subjects & Expertise
            </h2>
            <div class="expertise-section">
              <div class="subjects-list">
                <h3 class="subsection-title">Expected Subjects</h3>
                <div class="chips-container">
                  @for(subject of teacher?.expect_subjects; track $index){
                    <span class="subject-chip">
                        {{subject}}
                    </span>
                  }
                </div>
              </div>
              <div class="subjects-list">
                <h3 class="subsection-title">Assigned Subjects</h3>
                <div class="chips-container">
                  <span class="subject-chip assigned" *ngFor="let subject of teacher?.assigned_subjects">
                    {{subject}}
                  </span>
                </div>
              </div>

            </div>
          </section> -->

          <!-- Class Cards Section -->
          <section class="details-section">
            <div class="section-header">
              <h2 class="section-title">
                <span class="section-icon">🏫</span>
                Assigned Classes
              </h2>
            </div>
            
            <div class="classes-container">
              <!-- Add Class Card (First Card) -->
              <app-classes-card [addClass]="true" (click)="openAddClassModal()"/>
              
              <!-- Existing Class Cards -->
              @for(classItem of assigned_classes(); track $index; let parentIndex = $index) {
                  <!-- <app-classes-card 
                      [classroom]="classItem"
                      [addClass]="false"
                  /> -->
              }
            </div>
          </section>

          <!-- Add Class Modal -->
            @if(showAddClassModal()){
            <app-addclass-modal
                (close)="closeAddClassModal()"
                (classSelected)="onClassSelected($event)"
            />
            }

          <!-- Additional Information -->
          <section class="details-section">
            <h2 class="section-title">
              <span class="section-icon">📊</span>
              Additional Information
            </h2>
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-icon">📅</span>
                <div class="stat-content">
                  <span class="stat-value">3 Years</span>
                  <span class="stat-label">Years of Service</span>
                </div>
              </div>
              <div class="stat-card">
                <span class="stat-icon">🎯</span>
                <div class="stat-content">
                  <span class="stat-value">94%</span>
                  <span class="stat-label">Student Satisfaction</span>
                </div>
              </div>
              <div class="stat-card">
                <span class="stat-icon">📈</span>
                <div class="stat-content">
                  <span class="stat-value">A+</span>
                  <span class="stat-label">Performance Rating</span>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
